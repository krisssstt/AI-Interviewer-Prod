  <section class="auth-content content-inner auth-page" aria-labelledby="auth-title"><h1 id="auth-title">Восстановление пароля</h1><p class="auth-description">Укажите email, связанный с вашим аккаунтом.</p><form class="auth-form" id="reset-password" novalidate><div class="form-field"><label for="email">Email</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" maxlength="254" required></div><button class="form-button" type="submit">Получить ссылку</button><p id="reset-status" class="muted" role="status" hidden></p></form><p class="auth-bottom"><a class="text-link" href="login.html">← Вернуться ко входу</a></p></section>
