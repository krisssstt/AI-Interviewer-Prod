<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<script src="../js/theme.js"></script>
<script src="../js/ui-feedback.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>AI-интервьюер — Настройки оповещений</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/ui.css">
<script src="../js/platform-data.js" defer></script>
<script src="../js/progression.js" defer></script>
<script src="../js/technology-tracks.js" defer></script>
<script src="../js/enhancements.js" defer></script>
<script src="../js/app.js" defer></script>
<script src="../js/notifications.js" defer></script>
<link rel="stylesheet" href="../css/enhancements.css">
<link rel="stylesheet" href="../css/refinements.css">
<link rel="stylesheet" href="../css/themes.css">
<script src="../js/refinements.js" defer></script>
</head>
<body>

<main class="screen fixed home">
  <header class="app-header">
    <button class="header-action" type="button" data-open-menu aria-label="Открыть меню" aria-haspopup="dialog" aria-controls="side-menu"><img src="../images/icons/ic-menu.svg" alt=""></button>
    <h1>Настройки оповещений</h1>
    <a class="header-action" href="profile-4.html" aria-label="Уведомления"><img src="../images/icons/ic-bell.svg" alt=""></a>
  </header>
  <div class="content-inner reading-page">
    <a class="text-link" id="back-to-notifications" href="main.html?notifications=open">← К оповещениям</a>
    <section class="ui-card notification-settings">
      <div class="setting-row"><div><h3>Push-уведомления</h3><p class="muted">О новых тренировках</p></div><button type="button" class="tgb" role="switch" aria-checked="true" aria-label="Push-уведомления" data-setting="push"><img src="../images/icons/ic-toggle-on.svg" alt=""></button></div>
      <div class="setting-row"><div><h3>Email-рассылка</h3><p class="muted">Еженедельный отчет</p></div><button type="button" class="tgb" role="switch" aria-checked="true" aria-label="Email-рассылка" data-setting="email"><img src="../images/icons/ic-toggle-on.svg" alt=""></button></div>
      <div class="setting-row"><div><h3>SMS</h3><p class="muted">Только важные</p></div><button type="button" class="tgb" role="switch" aria-checked="false" aria-label="SMS" data-setting="sms"><img src="../images/icons/ic-toggle-off.svg" alt=""></button></div>
      <div class="setting-row"><h3>Время «не беспокоить»</h3><button class="text-button" id="quiet-hours" type="button" aria-haspopup="dialog" aria-controls="quiet-dialog">22:30–07:00</button></div>
    </section>
    <button type="button" class="form-button" id="save-notification-settings">Сохранить</button>
    <p class="muted" id="settings-status" role="status"></p>
  </div>
  <nav class="app-nav" aria-label="Основная навигация">
    <a href="main.html"><img src="../images/icons/ic-nav-home-off.svg" alt=""><span>Главная</span></a>
    <a href="training.html"><img src="../images/icons/ic-nav-chat.svg" alt=""><span>Тренировка</span></a>
    <a href="kb-1.html"><img src="../images/icons/ic-nav-books.svg" alt=""><span>База</span></a>
    <a href="analytics.html"><img src="../images/icons/ic-nav-chart.svg" alt=""><span>Прогресс</span></a>
    <a href="profile-1.html" aria-current="page"><img src="../images/icons/ic-nav-profile-on.svg" alt=""><span>Профиль</span></a>
  </nav>
</main>

</body>
</html>
